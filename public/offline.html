<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>ComicRoom - Offline</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: #111111;
            color: #f5f5f5;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: center;
        }

        main {
            max-width: 460px;
        }

        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            margin-bottom: 20px;
            border: 2px solid #f5c518;
            border-radius: 50%;
            color: #f5c518;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 0 0 24px;
            color: #b9b9b9;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 999px;
            background-color: #f5c518;
            color: #111111;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <div class="icon">CR</div>
        <h1>You are offline</h1>
        <p>This page is not available offline. Comics you have opened on this device are saved automatically and can be read offline.</p>
        <a href="/comic">Open the gallery</a>
    </main>
    <script>
        window.addEventListener('online', function () {
            window.location.reload();
        });
    </script>
</body>
</html>
